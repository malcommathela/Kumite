name: Library preview validation

on:
  push:
    branches:
      - feat/library-previews
      - fix/library-preview-rendering
      - feat/library-preview-snapshots
    paths:
      - 'apps/studio/electron/main/components/**'
      - 'apps/studio/electron/main/events/components.ts'
      - 'apps/studio/electron/main/lifecycle/vite.ts'
      - 'apps/studio/src/components/ComponentPreview/**'
      - 'apps/studio/src/lib/components/**'
      - 'apps/studio/src/routes/projects/ProjectsTab/LibraryView.tsx'
      - 'apps/studio/tests/preview-handshake.test.ts'
      - 'packages/models/src/constants/ipc.ts'
      - 'apps/studio/package.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/library-preview-validation.yml'
  pull_request:
    branches:
      - master
      - feat/library-previews
    paths:
      - 'apps/studio/electron/main/components/**'
      - 'apps/studio/electron/main/events/components.ts'
      - 'apps/studio/electron/main/lifecycle/vite.ts'
      - 'apps/studio/electron/main/storage/images.ts'
      - 'apps/studio/src/components/ComponentPreview/**'
      - 'apps/studio/src/lib/components/**'
      - 'apps/studio/src/routes/projects/ProjectsTab/LibraryView.tsx'
      - 'apps/studio/tests/preview-handshake.test.ts'
      - 'packages/models/src/constants/ipc.ts'
      - 'apps/studio/package.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/library-preview-validation.yml'
  workflow_dispatch:

jobs:
  preview-tests:
    name: Preview tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.8
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: bunx playwright install chromium
      - name: Build foundation packages
        run: bun run build:foundation
      - name: Run preview unit tests (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/studio
        run: >-
          bun test
          electron/main/components/implementation-materializer.test.ts
          electron/main/components/preview-workspace-cleanup.test.ts
          electron/main/components/preview-registry.test.ts
          electron/main/components/artifact-preview.test.ts
          electron/main/components/source-resolver.test.ts
          electron/main/components/preview-stylesheet.test.ts
          tests/preview-handshake.test.ts
      - name: Run preview unit and browser integration tests (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: apps/studio
        run: >-
          bun test
          electron/main/components/implementation-materializer.test.ts
          electron/main/components/preview-workspace-cleanup.test.ts
          electron/main/components/preview-registry.test.ts
          electron/main/components/artifact-preview.test.ts
          electron/main/components/source-resolver.test.ts
          electron/main/components/preview-stylesheet.test.ts
          tests/preview-handshake.test.ts
          electron/main/components/preview-registry.integration.test.ts
      - name: Typecheck Studio
        working-directory: apps/studio
        run: bun run typecheck
      - name: Build Studio
        working-directory: apps/studio
        run: bun run build
